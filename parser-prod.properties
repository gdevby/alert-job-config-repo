spring.h2.console.enabled=false
spring.jpa.properties.hibernate.format_sql=false
spring.datasource.username=${database_user}
spring.datasource.password=${database_user_password}
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.datasource.url=jdbc:mariadb://db:3306/parser_db?useUnicode=true&characterEncoding=utf-8&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC&autoReconnect=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.platform=prod
#used to parse orders from this site should have premium account
management.endpoints.web.exposure.include: health,info,metrics,prometheus  

parser.proxy.file.path=file:///etc/parser/config/proxies.txt

core.module.url=http://core:8018
