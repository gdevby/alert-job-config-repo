parser.insert.categories.active=${PARSER_INSERT_CATEGORIES_ACTIVE:true}
logging.level.by.gdev=${LOGGING_LEVEL_BY_GDEV:INFO}
relogin.freelance.every.minutes=${RELOGIN_FREELANCE_EVERY_MINUTES:25}
