management.endpoints.web.exposure.include=*

eureka.client.serviceUrl.defaultZone=http://eureka:8012/eureka
eureka.instance.preferIpAddress = true
eureka.client.fetchRegistry = true
spring.cloud.loadbalancer.ribbon.enabled = false
eureka.client.registerWithEureka=true

mail.smtp.username=${MAIL_SMTP_USERNAME}
mail.from.address=${MAIL_FROM_ADDRESS}
mail.smtp.password=${MAIL_SMTP_PASSWORD}
mail.smtp.host=${MAIL_SMTP_HOST}
mail.smtp.port=${MAIL_SMTP_PORT}
mail.smtp.transport.strategy=SMTP_TLS
telegram.chat.token=${TELEGRAM_CHAT_TOKEN}
#link of the bot http://t.me/alertJobGdevBybot

#\u041A\u043E\u043D\u0444\u0438\u0433\u0443\u0440\u0430\u0446\u0438\u044F \u043F\u043E\u0434\u043A\u043B\u044E\u0447\u0435\u043D\u0438\u044F \u043A \u043F\u043E\u0447\u0442\u043E\u0432\u043E\u043C\u0443 \u044F\u0449\u0438\u043A\u0443 \u0434\u043B\u044F \u043F\u0440\u0438\u0435\u043C\u0430 \u0440\u0430\u0437\u043E\u0432\u044B\u0445 \u043A\u043E\u0434\u043E\u0432 \u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u0435\u043B\u0435\u0439
mailbox.host=${MAILBOX_HOST}
mailbox.username=${MAILBOX_USERNAME}
mailbox.password=${MAILBOX_PWD}
mailbox.folder=INBOX

#\u0417\u0430\u043F\u0440\u043E\u0441 \u0434\u0430\u043D\u043D\u044B\u0445 \u0430\u0432\u0442\u043E\u0440\u0438\u0437\u0430\u0446\u0438\u0438 \u0438\u0437 \u043C\u043E\u0434\u0443\u043B\u044F CORE
core.service.url=${CORE_SERVICE_URL:http://core:8018}

#\u0420\u0435\u0436\u0438\u043C "\u0431\u0435\u0437 \u043E\u043A\u043D\u0430" \u0434\u043B\u044F \u043F\u0430\u0440\u0441\u0435\u0440\u043E\u0432 \u0430\u0432\u0442\u043E\u043E\u0442\u0432\u0435\u0442\u0430
parser.autoreply.headless.weblancer.net=${HEADLESS_WEBLANCER:true}
parser.autoreply.headless.kwork.ru=${HEADLESS_KWORKRU:true}
parser.autoreply.headless.fl.ru=${HEADLESS_FLRU:true}
parser.autoreply.headless.youdo.com=${HEADLESS_YOUDO:true}
parser.autoreply.headless.freelance.ru=${HEADLESS_FREELANCERU:true}

#\u041E\u0442\u043F\u0440\u0430\u0432\u043B\u044F\u0442\u044C \u043B\u0438 \u0430\u0432\u0442\u043E\u043E\u0442\u0432\u0435\u0442 \u0432 \u043F\u0430\u0440\u0441\u0435\u0440\u0435 \u0430\u0432\u0442\u043E\u043E\u0442\u0432\u0435\u0442\u0430 
parser.autoreply.send.request.weblancer.net=${ARPL_WEBLANCER:true}
parser.autoreply.send.request.kwork.ru=${ARPL_KWORKRU:true}
parser.autoreply.send.request.fl.ru=${ARPL_FLRU:true}
parser.autoreply.send.request.youdo.com=${ARPL_YOUDO:true}
parser.autoreply.send.request.freelance.ru=${ARPL_FREELANCERU:true}

#\u041D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0438 \u043F\u0440\u043E\u043A\u0441\u0438 \u0434\u043B\u044F \u043F\u0430\u0440\u0441\u0435\u0440\u043E\u0432, \u043D\u0435\u043E\u0431\u0445\u043E\u0434\u0438\u043C\u043E \u0440\u0430\u0441\u043F\u0438\u0441\u0430\u0442\u044C
parser.autoreply.proxy.kwork.ru=${PRX_KWORKRU:true}
parser.autoreply.proxy.weblancer.net=${PRX_WEBLANCER:true}
parser.autoreply.proxy.fl.ru=${PRX_FLRU:true}
parser.autoreply.proxy.youdo.com=${PRX_YOUDO:true}
parser.autoreply.proxy.freelance.ru=${PRX_FREELANCERU:true}
#\u043D\u0435\u043E\u0431\u0445\u043E\u0434\u0438\u043C\u043E \u0440\u0430\u0441\u043F\u0438\u0441\u0430\u0442\u044C
parser.proxy.mode=${PARSER_PROXY_MODE}
parser.proxy.file.path=${PROXY_FILE}
parser.proxy.url=${PROXY_URL}
proxy.reassign.interval.minutes=120 